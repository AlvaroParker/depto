openapi: 3.1.0
info:
  title: Shared Expense Tracker API
  version: 1.0.0
  description: Authenticated application endpoints used by the Spanish household expense UI.
  license:
    name: Private household use
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
  schemas:
    ApiError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    UserRole:
      type: string
      enum: [root, admin, user]
    ManagedUser:
      type: object
      required: [id, username, displayName, role, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
    ManagedUserInput:
      type: object
      required: [username, displayName, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 128 }
        role: { type: string, enum: [admin, user] }
    ManagedUserUpdateInput:
      type: object
      required: [username, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 128 }
    BootstrapRootInput:
      type: object
      required: [username, displayName, password, passwordConfirmation]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 128 }
        passwordConfirmation: { type: string, minLength: 12, maxLength: 128 }
    Participant:
      type: object
      required: [id, name, slug, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
    Share:
      type: object
      required: [id, participant, shareAmountMinor, status]
      properties:
        id: { type: string }
        participant: { $ref: "#/components/schemas/Participant" }
        shareAmountMinor: { type: integer, minimum: 0 }
        status: { type: string, enum: [settled, pending, paid] }
        paidAt: { type: [string, "null"], format: date-time }
        markedByUserId: { type: [string, "null"] }
    ExpenseSummary:
      type: object
      required: [id, name, amountMinor, currency, expenseDate, payer, hasReceipt, shares]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expenseDate: { type: string, format: date }
        payer: { $ref: "#/components/schemas/Participant" }
        hasReceipt: { type: boolean }
        shares:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/Share" }
    ExpenseDetail:
      allOf:
        - { $ref: "#/components/schemas/ExpenseSummary" }
        - type: object
          required: [createdByUserId, createdAt, updatedAt]
          properties:
            receiptFilename: { type: [string, "null"] }
            receiptContentType: { type: [string, "null"] }
            receiptSizeBytes: { type: [integer, "null"] }
            createdByUserId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [name, amountMinor, currency, expenseDate, paidByParticipantId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expenseDate: { type: string, format: date }
        paidByParticipantId: { type: string }
    Dashboard:
      type: object
      required:
        [expenseCount, totalAmountMinor, pendingTotalMinor, balances, pendingMatrix, recentExpenses]
      properties:
        expenseCount: { type: integer, minimum: 0 }
        totalAmountMinor: { type: integer, minimum: 0 }
        pendingTotalMinor: { type: integer, minimum: 0 }
        balances:
          type: array
          items:
            type: object
            required: [participant, totalPaidMinor, totalShareMinor, netBalanceMinor]
            properties:
              participant: { $ref: "#/components/schemas/Participant" }
              totalPaidMinor: { type: integer }
              totalShareMinor: { type: integer }
              netBalanceMinor:
                type: integer
                description: Outstanding net position; positive is owed to the participant and negative is owed by them.
        pendingMatrix:
          type: array
          items:
            type: object
            required: [from, to, amountMinor]
            properties:
              from: { $ref: "#/components/schemas/Participant" }
              to: { $ref: "#/components/schemas/Participant" }
              amountMinor: { type: integer, minimum: 1 }
        recentExpenses:
          type: array
          items: { $ref: "#/components/schemas/ExpenseSummary" }
paths:
  /bootstrap:
    get:
      operationId: getBootstrapStatus
      summary: Report whether the one-time root setup is available
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [needsBootstrap]
                properties:
                  needsBootstrap: { type: boolean }
    post:
      operationId: createRootUser
      summary: Create the single root account when none exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRootInput" }
      responses:
        "201": { description: Root created }
        "400": { description: Validation failed }
        "409": { description: Root already exists or username is occupied }
  /admin/users:
    get:
      operationId: listManagedUsers
      summary: List active application users for root and admin
      responses:
        "200":
          description: Active users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/ManagedUser" }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
    post:
      operationId: createManagedUser
      summary: Create an admin or regular user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserInput" }
      responses:
        "201": { description: User created }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "409": { description: Username already exists }
  /admin/users/{userId}:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string } }
    patch:
      operationId: updateManagedUser
      summary: Update a regular user's username, display name, and optionally password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserUpdateInput" }
      responses:
        "200":
          description: Regular user updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Username occupied or target role is protected }
    delete:
      operationId: deleteManagedUser
      summary: Disable a non-root account while preserving audit history
      responses:
        "204": { description: Access removed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Root or current account is protected }
  /participants:
    get:
      operationId: listParticipants
      summary: List active participants in split order
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/Participant" }
        "401": { description: Unauthenticated }
  /dashboard:
    get:
      operationId: getDashboard
      summary: Return dashboard totals and recent expenses
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { description: Unauthenticated }
  /expenses:
    get:
      operationId: listExpenses
      summary: Search, filter, sort, and paginate non-deleted expenses
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: payer, schema: { type: string } }
        - { in: query, name: pending, schema: { type: boolean } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Expense page
          content:
            application/json:
              schema:
                type: object
                required: [expenses, page, pageSize, total]
                properties:
                  expenses:
                    type: array
                    items: { $ref: "#/components/schemas/ExpenseSummary" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { description: Invalid filters }
        "401": { description: Unauthenticated }
    post:
      operationId: createExpense
      summary: Atomically create an expense and three shares
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { description: Unauthenticated }
  /expenses/{expenseId}:
    parameters:
      - { in: path, name: expenseId, required: true, schema: { type: string } }
    get:
      operationId: getExpense
      summary: Return expense detail and all shares
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
    patch:
      operationId: updateExpense
      summary: Update an expense and conditionally recalculate shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ExpenseInput" }
                - type: object
                  properties:
                    resetPaidReimbursements: { type: boolean, default: false }
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
        "409": { description: Paid reimbursement reset confirmation required }
    delete:
      operationId: deleteExpense
      summary: Soft-delete an expense and retain its receipt
      responses:
        "204": { description: Expense deleted }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
  /expenses/{expenseId}/receipt:
    parameters:
      - { in: path, name: expenseId, required: true, schema: { type: string } }
    put:
      operationId: putExpenseReceipt
      summary: Stream and attach a private receipt
      parameters:
        - {
            in: header,
            name: X-Receipt-Filename,
            required: true,
            schema: { type: string, maxLength: 255 },
          }
        - {
            in: header,
            name: X-Receipt-Size,
            required: true,
            schema: { type: integer, maximum: 10485760 },
          }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/webp: { schema: { type: string, contentEncoding: binary } }
          application/pdf: { schema: { type: string, contentEncoding: binary } }
      responses:
        "200":
          description: Receipt attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400": { description: "Invalid type, name, body, or size" }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
        "413": { description: Receipt exceeds 10 MB }
    get:
      operationId: getExpenseReceipt
      summary: Stream a private receipt associated with the expense
      responses:
        "200":
          description: Receipt body with its stored content type and safe content disposition
        "401": { description: Unauthenticated }
        "404": { description: Expense or receipt not found }
  /expense-shares/{shareId}/status:
    patch:
      operationId: updateExpenseShareStatus
      summary: Mark a non-payer share paid or pending
      parameters:
        - { in: path, name: shareId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, paid] }
      responses:
        "200":
          description: Updated share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { description: Invalid transition or body }
        "401": { description: Unauthenticated }
        "404": { description: Share not found }
