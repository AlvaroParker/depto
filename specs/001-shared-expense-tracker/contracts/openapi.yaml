openapi: 3.1.0
info:
  title: Shared Expense Tracker API
  version: 1.0.0
  description: Authenticated application endpoints used by the Spanish household expense UI.
  license:
    name: Private household use
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
  schemas:
    ApiError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    UserRole:
      type: string
      enum: [root, admin, user]
    ManagedUser:
      type: object
      required: [id, username, displayName, email, participantId, role, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email:
          type: [string, "null"]
          format: email
          description: Required for regular users; null for root and admin.
        participantId:
          type: [string, "null"]
          description: Required for regular users and null for root or admin.
        role: { $ref: "#/components/schemas/UserRole" }
        createdAt: { type: string, format: date-time }
        disabledAt: { type: [string, "null"], format: date-time }
    ManagedUserInput:
      type: object
      required: [username, displayName, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email:
          type: string
          format: email
          maxLength: 254
          description: Required when role is user and omitted when role is admin.
        password: { type: string, minLength: 12, maxLength: 128 }
        role: { type: string, enum: [admin, user] }
    ManagedUserUpdateInput:
      type: object
      required: [username, displayName, email]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    BootstrapRootInput:
      type: object
      required: [username, displayName, password, passwordConfirmation]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 128 }
        passwordConfirmation: { type: string, minLength: 12, maxLength: 128 }
    Participant:
      type: object
      required: [id, name, slug, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
    ExpenseKind:
      type: object
      required: [id, name, iconKey, sortOrder]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 60 }
        iconKey:
          type: string
          enum:
            [
              house,
              building,
              water,
              electricity,
              gas,
              internet,
              groceries,
              food,
              cleaning,
              appliances,
              furniture,
              repairs,
              transport,
              health,
              pets,
              education,
              other,
              children,
              car,
              gift,
              travel,
              clothing,
              fitness,
              entertainment,
            ]
        sortOrder: { type: integer, minimum: 1 }
    ExpenseKindInput:
      type: object
      required: [name, iconKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        iconKey: { $ref: "#/components/schemas/ExpenseKind/properties/iconKey" }
    Share:
      type: object
      required: [id, participant, shareAmountMinor, status]
      properties:
        id: { type: string }
        participant: { $ref: "#/components/schemas/Participant" }
        shareAmountMinor: { type: integer, minimum: 0 }
        status: { type: string, enum: [settled, pending, paid] }
        paidAt: { type: [string, "null"], format: date-time }
        markedByUserId: { type: [string, "null"] }
        paymentProof:
          anyOf:
            - { $ref: "#/components/schemas/PaymentProof" }
            - { type: "null" }
    ExpenseSplitMode:
      type: string
      enum: [equal, custom, open]
    ExpenseShareAllocation:
      type: object
      required: [participantId, shareAmountMinor]
      properties:
        participantId: { type: string }
        shareAmountMinor: { type: integer, minimum: 0 }
    PaymentProof:
      type: object
      required: [filename, contentType, sizeBytes, uploadedAt, uploadedByUserId]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        uploadedAt: { type: string, format: date-time }
        uploadedByUserId: { type: string }
    ExpenseSummary:
      type: object
      required:
        [id, name, amountMinor, currency, expenseDate, kind, payer, hasReceipt, shares, splitMode]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expenseDate: { type: string, format: date }
        kind: { $ref: "#/components/schemas/ExpenseKind" }
        payer: { $ref: "#/components/schemas/Participant" }
        hasReceipt: { type: boolean }
        splitMode: { $ref: "#/components/schemas/ExpenseSplitMode" }
        shares:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Share" }
    ExpenseDetail:
      allOf:
        - { $ref: "#/components/schemas/ExpenseSummary" }
        - type: object
          required: [createdByUserId, createdAt, updatedAt]
          properties:
            receiptFilename: { type: [string, "null"] }
            receiptContentType: { type: [string, "null"] }
            receiptSizeBytes: { type: [integer, "null"] }
            createdByUserId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required:
        [name, amountMinor, currency, expenseDate, kindId, paidByParticipantId, participantIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 2000 }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expenseDate: { type: string, format: date }
        kindId: { type: string }
        paidByParticipantId: { type: string }
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        splitMode:
          allOf: [{ $ref: "#/components/schemas/ExpenseSplitMode" }]
          default: equal
        shareAllocations:
          type: array
          uniqueItems: true
          description: >-
            Required for custom and open modes, with one non-negative allocation per selected
            participant and an exact sum equal to amountMinor. Omitted for equal mode.
          items: { $ref: "#/components/schemas/ExpenseShareAllocation" }
    ExpenseCreateInput:
      allOf:
        - { $ref: "#/components/schemas/ExpenseInput" }
        - type: object
          properties:
            initialPaidParticipantIds:
              type: array
              uniqueItems: true
              default: []
              description: Selected non-payers whose shares start paid; the payer is not allowed.
              items: { type: string }
    Dashboard:
      type: object
      required:
        [expenseCount, totalAmountMinor, pendingTotalMinor, balances, pendingMatrix, recentExpenses]
      properties:
        expenseCount: { type: integer, minimum: 0 }
        totalAmountMinor: { type: integer, minimum: 0 }
        pendingTotalMinor: { type: integer, minimum: 0 }
        balances:
          type: array
          items:
            type: object
            required: [participant, totalPaidMinor, totalShareMinor, netBalanceMinor]
            properties:
              participant: { $ref: "#/components/schemas/Participant" }
              totalPaidMinor: { type: integer }
              totalShareMinor: { type: integer }
              netBalanceMinor:
                type: integer
                description: Outstanding net position; positive is owed to the participant and negative is owed by them.
        pendingMatrix:
          type: array
          items:
            type: object
            required: [from, to, amountMinor]
            properties:
              from: { $ref: "#/components/schemas/Participant" }
              to: { $ref: "#/components/schemas/Participant" }
              amountMinor: { type: integer, minimum: 1 }
        recentExpenses:
          type: array
          items: { $ref: "#/components/schemas/ExpenseSummary" }
paths:
  /bootstrap:
    get:
      operationId: getBootstrapStatus
      summary: Report whether the one-time root setup is available
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                required: [needsBootstrap]
                properties:
                  needsBootstrap: { type: boolean }
    post:
      operationId: createRootUser
      summary: Create the single root account when none exists
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRootInput" }
      responses:
        "201": { description: Root created }
        "400": { description: Validation failed }
        "409": { description: Root already exists or username is occupied }
  /admin/users:
    get:
      operationId: listManagedUsers
      summary: List active application users for root and admin
      responses:
        "200":
          description: Active users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/ManagedUser" }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
    post:
      operationId: createManagedUser
      summary: Create an admin or regular user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserInput" }
      responses:
        "201": { description: User created }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "409": { description: Username or participant email already exists }
  /admin/users/{userId}:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string } }
    patch:
      operationId: updateManagedUser
      summary: Update a regular user's username, display name, email, and optionally password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedUserUpdateInput" }
      responses:
        "200":
          description: Regular user updated
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/ManagedUser" }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Username/email occupied or target role is protected }
    delete:
      operationId: deleteManagedUser
      summary: Disable a non-root account while preserving audit history
      responses:
        "204": { description: Access removed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "404": { description: User not found }
        "409": { description: Root or current account is protected }
  /admin/expense-kinds:
    get:
      operationId: listExpenseKinds
      summary: List expense categories for root and admin
      responses:
        "200":
          description: Expense categories
          content:
            application/json:
              schema:
                type: object
                required: [kinds]
                properties:
                  kinds:
                    type: array
                    items: { $ref: "#/components/schemas/ExpenseKind" }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
    post:
      operationId: createExpenseKind
      summary: Create an expense category and select its icon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseKindInput" }
      responses:
        "201": { description: Expense category created }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "409": { description: Category name already exists }
  /admin/expense-kinds/{kindId}:
    parameters:
      - { in: path, name: kindId, required: true, schema: { type: string } }
    patch:
      operationId: updateExpenseKind
      summary: Update an expense category name and icon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseKindInput" }
      responses:
        "200": { description: Expense category updated }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role }
        "404": { description: Expense category not found }
        "409": { description: Category name already exists }
  /participants:
    get:
      operationId: listParticipants
      summary: List active participants in split order
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  participants:
                    type: array
                    items: { $ref: "#/components/schemas/Participant" }
        "401": { description: Unauthenticated }
  /dashboard:
    get:
      operationId: getDashboard
      summary: Return dashboard totals and recent expenses
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { description: Unauthenticated }
  /expenses:
    get:
      operationId: listExpenses
      summary: Search, filter, sort, and paginate non-deleted expenses
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: payer, schema: { type: string } }
        - in: query
          name: pending
          description: >-
            Reimbursement state. `true` finds any household pending share, `false` finds fully
            reimbursed expenses, and `mine` finds pending shares for the authenticated regular
            user's participant.
          schema: { type: string, enum: ["true", "false", mine] }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            in: query,
            name: pageSize,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Expense page
          content:
            application/json:
              schema:
                type: object
                required: [expenses, page, pageSize, total]
                properties:
                  expenses:
                    type: array
                    items: { $ref: "#/components/schemas/ExpenseSummary" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { description: Invalid filters }
        "401": { description: Unauthenticated }
        "403": { description: Personal filter requested by an account without a participant }
    post:
      operationId: createExpense
      summary: Atomically create an expense and one share per selected participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCreateInput" }
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400":
          description: Validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { description: Unauthenticated }
  /expenses/{expenseId}:
    parameters:
      - { in: path, name: expenseId, required: true, schema: { type: string } }
    get:
      operationId: getExpense
      summary: Return expense detail and all shares
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
    patch:
      operationId: updateExpense
      summary: Update an expense and conditionally recalculate shares
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ExpenseInput" }
                - type: object
                  properties:
                    resetPaidReimbursements: { type: boolean, default: false }
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400": { description: Validation failed }
        "401": { description: Unauthenticated }
        "403": { description: Only root/admin may structurally edit an existing open expense }
        "404": { description: Expense not found }
        "409": { description: Paid reimbursement reset confirmation required }
    delete:
      operationId: deleteExpense
      summary: Soft-delete an expense and retain its receipt
      responses:
        "204": { description: Expense deleted }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
  /expenses/{expenseId}/receipt:
    parameters:
      - { in: path, name: expenseId, required: true, schema: { type: string } }
    put:
      operationId: putExpenseReceipt
      summary: Stream and attach a private receipt
      parameters:
        - {
            in: header,
            name: X-Receipt-Filename,
            required: true,
            schema: { type: string, maxLength: 255 },
          }
        - {
            in: header,
            name: X-Receipt-Size,
            required: true,
            schema: { type: integer, maximum: 10485760 },
          }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/webp: { schema: { type: string, contentEncoding: binary } }
          application/pdf: { schema: { type: string, contentEncoding: binary } }
      responses:
        "200":
          description: Receipt attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseDetail" }
        "400": { description: "Invalid type, name, body, or size" }
        "401": { description: Unauthenticated }
        "404": { description: Expense not found }
        "413": { description: Receipt exceeds 10 MB }
    get:
      operationId: getExpenseReceipt
      summary: Stream a private receipt associated with the expense
      responses:
        "200":
          description: Receipt body with its stored content type and safe content disposition
        "401": { description: Unauthenticated }
        "404": { description: Expense or receipt not found }
  /expense-shares/{shareId}/status:
    patch:
      operationId: updateExpenseShareStatus
      summary: Mark a non-payer share paid or pending
      parameters:
        - { in: path, name: shareId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, paid] }
      responses:
        "200":
          description: Updated share
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { description: Invalid transition or body }
        "401": { description: Unauthenticated }
        "403": { description: Only the share owner or root/admin may mutate it }
        "404": { description: Share not found }
  /expense-shares/{shareId}/amount:
    patch:
      operationId: updateOpenExpenseShareAmount
      summary: Update a pending participant-owned amount on an open expense
      parameters:
        - { in: path, name: shareId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareAmountMinor]
              properties:
                shareAmountMinor: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Ordered shares after atomically updating the participant and payer remainder
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items: { $ref: "#/components/schemas/Share" }
        "400": { description: Invalid body or payer share mutation }
        "401": { description: Unauthenticated }
        "403": { description: Only the share owner or root/admin may mutate it }
        "404": { description: Share not found }
        "409":
          { description: Expense is not open, share is paid, or amount exceeds available total }
  /expense-shares/{shareId}/proof:
    put:
      operationId: putExpenseSharePaymentProof
      summary: Mark a pending share paid with proof, or add or replace proof on a paid share
      parameters:
        - { in: path, name: shareId, required: true, schema: { type: string } }
        - { in: header, name: x-receipt-filename, required: true, schema: { type: string } }
        - {
            in: header,
            name: x-receipt-size,
            required: true,
            schema: { type: integer, maximum: 10485760 },
          }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/webp: { schema: { type: string, contentEncoding: binary } }
      responses:
        "200":
          description: Updated paid share with current proof metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { description: "Invalid type, name, body, size, or settled share" }
        "401": { description: Unauthenticated }
        "403": { description: Only the share owner or root/admin may upload }
        "404": { description: Share not found }
        "413": { description: Proof exceeds 10 MB }
    get:
      operationId: getExpenseSharePaymentProof
      summary: Stream current proof for an active expense share to an authenticated household user
      parameters:
        - { in: path, name: shareId, required: true, schema: { type: string } }
      responses:
        "200": { description: Private proof image body with safe inline response headers }
        "401": { description: Unauthenticated }
        "404": { description: Share or proof not found }
